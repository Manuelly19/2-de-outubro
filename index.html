<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomedicina</title>

    <style>
        body {
            background-color: #ffd6e7;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #d63384;
        }

        p {
            font-size: 20px;
            color: #555;
        }

        button {
            background-color: #e75491;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c93672;
        }
    </style>
</head>

<body>

    <h1>🧬 Biomedicina</h1>

    <p id="mensagem">
        Clique no botão para descobrir uma curiosidade!
    </p>

    <button onclick="mostrarMensagem()">
        Mostrar curiosidade
    </button>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerHTML =
                "🔬 A Biomedicina contribui para o diagnóstico e a prevenção de diversas doenças.";
        }
    </script>

</body>
</html>
